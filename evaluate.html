<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hidden Reveal - Evaluate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Evaluate Encoding</h1>
    <p class="subtitle">Upload an encoded PNG to verify the math works losslessly.</p>
  </header>
  <main class="card">
    <div class="field">
      <label for="eval-input">Upload Encoded PNG</label>
      <input type="file" id="eval-input" accept="image/png">
    </div>
    <button class="btn btn-primary" id="eval-btn" disabled>Verify Payload</button>
    
    <div id="eval-result" class="msg info" style="display:none; margin-top: 1rem; font-size: 1.2rem;"></div>
    <canvas id="eval-canvas" style="max-width:100%; margin-top:1rem; border:1px solid #333;"></canvas>
  </main>
  <nav class="page-nav">
    <a href="index.html">← Back to Encoder</a>
  </nav>
  <script type="module" src="js/evaluate.js"></script>
</body>
</html>
