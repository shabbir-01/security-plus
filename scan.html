<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Reveal - Scanner</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #111;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #camera-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #video-preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #processing-canvas {
            display: none;
        }

        #status-area {
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-sizing: border-box;
            background: #222;
            transition: background-color 0.3s;
        }

        .status-searching { background: #e67e22; color: white; }
        .status-reading { background: #3498db; color: white; }
        .status-success { background: #2ecc71; color: white; }
        .status-error { background: #e74c3c; color: white; }

        #success-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #2ecc71;
            text-align: center;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #success-message h2 {
            margin-top: 0;
            color: #2ecc71;
        }

        #decoded-text {
            font-size: 1.5rem;
            word-wrap: break-word;
            margin-bottom: 20px;
        }

        #restart-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
        }

        #restart-btn:hover { background: #2980b9; }

        #hint-text {
            font-size: 1rem;
            font-weight: normal;
            margin-top: 10px;
            color: #f1c40f;
            min-height: 1.2rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="status-area" class="status-searching">
        <div id="status-text">Point camera at the screen</div>
        <div id="hint-text"></div>
    </div>

    <div id="camera-container">
        <video id="video-preview" autoplay playsinline muted></video>
        <canvas id="processing-canvas"></canvas>
        <canvas id="debug-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; opacity: 0.5; display:none;"></canvas>
    </div>

    <div id="success-message">
        <h2>Message Decoded!</h2>
        <div id="decoded-text"></div>
        <button id="restart-btn">Scan Again</button>
    </div>

    <!-- We use type="module" so we can import from stego-config.js -->
    <script type="module" src="js/decoder.js"></script>
</body>
</html>
